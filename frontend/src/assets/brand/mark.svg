<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Outer signal ring -->
  <circle cx="16" cy="16" r="14" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <!-- Secondary ring -->
  <circle cx="16" cy="16" r="9.5" stroke="#38BDF8" stroke-width="1.75" />
  <!-- Crosshairs -->
  <line x1="16" y1="2" x2="16" y2="7" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="16" y1="25" x2="16" y2="30" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="2" y1="16" x2="7" y2="16" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="25" y1="16" x2="30" y2="16" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <!-- Core operational marker -->
  <circle cx="16" cy="16" r="4" fill="#38BDF8" />
  <circle cx="16" cy="16" r="1.5" fill="#0A101C" />
</svg>

