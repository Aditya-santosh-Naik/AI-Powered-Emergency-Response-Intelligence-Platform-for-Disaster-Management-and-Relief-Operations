<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="100%" height="100%">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="uttarakhandSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B779A" />
      <stop offset="45%" stop-color="#82A6C2" />
      <stop offset="85%" stop-color="#BDD4E7" />
      <stop offset="100%" stop-color="#DCE7F0" />
    </linearGradient>

    <!-- Mountain far gradient -->
    <linearGradient id="uttarakhandMtnFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#556E82" />
      <stop offset="60%" stop-color="#3A4E5E" />
      <stop offset="100%" stop-color="#243442" />
    </linearGradient>

    <!-- Mountain mid gradient -->
    <linearGradient id="uttarakhandMtnMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#365042" />
      <stop offset="50%" stop-color="#233B2E" />
      <stop offset="100%" stop-color="#15281E" />
    </linearGradient>

    <!-- River water gradient -->
    <linearGradient id="uttarakhandRiver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A8896" />
      <stop offset="40%" stop-color="#70A0AD" />
      <stop offset="70%" stop-color="#4F7B87" />
      <stop offset="100%" stop-color="#3A636E" />
    </linearGradient>

    <!-- River foam / surge -->
    <linearGradient id="riverFoam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2F1F8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#CDE2EE" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="320" height="200" fill="url(#uttarakhandSky)" />

  <!-- Mist / clouds around peaks -->
  <ellipse cx="160" cy="50" rx="140" ry="25" fill="#FFFFFF" opacity="0.35" filter="blur(8px)" />
  <ellipse cx="60" cy="70" rx="90" ry="20" fill="#FFFFFF" opacity="0.4" filter="blur(6px)" />
  <ellipse cx="260" cy="65" rx="80" ry="20" fill="#FFFFFF" opacity="0.3" filter="blur(6px)" />

  <!-- Distant High Himalayan Peaks -->
  <polygon points="0,95 45,55 90,85 140,40 185,75 240,35 285,68 320,50 320,130 0,130" fill="url(#uttarakhandMtnFar)" />

  <!-- Snow on peaks -->
  <polygon points="140,40 128,55 136,58 140,52 146,60 152,50" fill="#FFFFFF" opacity="0.9" />
  <polygon points="240,35 228,52 236,54 240,48 248,56 254,46" fill="#FFFFFF" opacity="0.9" />
  <polygon points="45,55 35,68 42,70 45,65 52,72 56,64" fill="#FFFFFF" opacity="0.85" />

  <!-- Mid Pine-Covered Slopes -->
  <path d="M0,85 Q60,110 120,80 T220,95 Q270,75 320,105 L320,150 L0,150 Z" fill="url(#uttarakhandMtnMid)" />
  <path d="M0,110 Q70,95 140,120 T280,105 L320,125 L320,170 L0,170 Z" fill="#1C3024" />

  <!-- Valley settlements / buildings along the ridge -->
  <rect x="75" y="108" width="8" height="6" fill="#E2E8F0" rx="1" />
  <polygon points="73,108 79,103 85,108" fill="#DC2626" />
  <rect x="87" y="106" width="10" height="8" fill="#CBD5E1" rx="1" />
  <polygon points="85,106 92,101 99,106" fill="#2563EB" />
  <rect x="101" y="110" width="7" height="6" fill="#E2E8F0" rx="1" />
  <polygon points="100,110 104,106 109,110" fill="#EA580C" />

  <rect x="220" y="112" width="9" height="7" fill="#E2E8F0" rx="1" />
  <polygon points="218,112 224,107 231,112" fill="#DC2626" />
  <rect x="233" y="114" width="8" height="6" fill="#F1F5F9" rx="1" />
  <polygon points="231,114 237,110 243,114" fill="#3B82F6" />

  <!-- River Surge Basin (Swollen Monsoon Water) -->
  <path d="M0,140 Q90,132 160,148 T320,135 L320,200 L0,200 Z" fill="url(#uttarakhandRiver)" />

  <!-- Rushing river torrent lines -->
  <path d="M10,155 Q80,146 150,160 T310,148" stroke="url(#riverFoam)" stroke-width="3" fill="none" opacity="0.8" />
  <path d="M0,170 Q110,158 200,175 T320,165" stroke="url(#riverFoam)" stroke-width="4.5" fill="none" opacity="0.9" />
  <path d="M30,185 Q120,178 220,188 T310,182" stroke="url(#riverFoam)" stroke-width="3.5" fill="none" opacity="0.75" />

  <!-- Riverbank rocks and debris -->
  <ellipse cx="40" cy="192" rx="18" ry="8" fill="#475569" />
  <ellipse cx="65" cy="196" rx="14" ry="6" fill="#334155" />
  <ellipse cx="280" cy="190" rx="22" ry="9" fill="#475569" />
  <ellipse cx="250" cy="195" rx="15" ry="7" fill="#334155" />

  <!-- Tactical Emergency Response Boat with rescue light -->
  <g transform="translate(145, 168) scale(0.9)">
    <!-- Boat hull -->
    <path d="M0,8 L28,8 L24,16 L4,16 Z" fill="#EA580C" />
    <path d="M4,14 L24,14 L22,17 L6,17 Z" fill="#C2410C" />
    <!-- Cabin -->
    <rect x="8" y="3" width="10" height="6" fill="#FFFFFF" rx="1" />
    <!-- Emergency Flashing Beacon -->
    <circle cx="13" cy="2" r="2.5" fill="#EF4444" />
    <circle cx="13" cy="2" r="5" fill="#EF4444" opacity="0.4" />
  </g>

  <!-- Emergency Helicopter silhouette in sky -->
  <g transform="translate(70, 48) scale(0.65)" opacity="0.85">
    <ellipse cx="14" cy="8" rx="8" ry="4" fill="#1E293B" />
    <line x1="2" y1="2" x2="26" y2="2" stroke="#1E293B" stroke-width="1.5" />
    <line x1="14" y1="2" x2="14" y2="5" stroke="#1E293B" stroke-width="1.5" />
    <path d="M22,8 L32,6 L32,10 Z" fill="#1E293B" />
    <line x1="31" y1="4" x2="31" y2="12" stroke="#1E293B" stroke-width="1.2" />
    <!-- Searchlight beam -->
    <polygon points="12,12 2,28 18,28" fill="#FEF08A" opacity="0.4" />
  </g>
</svg>
